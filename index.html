<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta</title>
<link id="favicon" rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="cabecera">
  <div class="banda"></div>
  <div class="cab-in">
    <img class="logo" id="logo" src="assets/img/logo.png" alt="">
    <div>
      <h1 id="negocio-nombre"></h1>
      <p class="lema" id="negocio-lema"></p>
      <ul class="datos">
        <li id="negocio-dias"></li>
        <li id="negocio-dir"></li>
        <li class="mesa" id="negocio-mesa" hidden></li>
        <li><a id="negocio-wsp" href="#" target="_blank" rel="noopener">WhatsApp</a></li>
      </ul>
    </div>
  </div>
</header>

<div class="barra">
  <div class="barra-in">
    <input id="buscar" type="search" placeholder="Buscar por productos" aria-label="Buscar por productos" autocomplete="off">
    <div class="cats-wrap">
      <button class="flecha izq" type="button" id="cats-izq" aria-label="Ver categorías anteriores" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <nav class="cats" id="cats" aria-label="Categorías"></nav>
      <button class="flecha der" type="button" id="cats-der" aria-label="Ver más categorías" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<main id="carta"></main>
<p class="sin-res" id="sin-res" hidden>No encontramos productos con esa búsqueda.</p>

<footer id="pie"></footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="m-nombre">
    <button class="cerrar" type="button" id="m-cerrar" aria-label="Cerrar">×</button>

    <!-- Acá se muestra el video del plato (se arma desde funciones.js) -->
    <div class="media-caja">
      <div id="m-zona"></div>
    </div>

    <div class="m-info">
      <p class="m-cat" id="m-cat"></p>
      <div class="m-fila">
        <h3 id="m-nombre"></h3>
        <strong class="m-precio" id="m-precio"></strong>
      </div>
      <p class="m-desc" id="m-desc"></p>
    </div>

    <!-- Opciones del plato: tamaño/cantidad, elecciones, cambios y "Sin…" (se arma desde funciones.js) -->
    <div class="m-opc" id="m-opciones" hidden></div>

    <!-- Barra de acciones: queda fija abajo del modal aunque haya muchas opciones -->
    <div class="m-acciones">
      <p class="m-error" id="m-error" role="alert" hidden></p>
      <div class="m-botones">
        <button type="button" class="btn-agregar" id="m-agregar">Agregar al carrito</button>
        <button type="button" class="btn-pedir" id="m-pedir">Pedir ahora</button>
      </div>
    </div>
  </div>
</div>

<!-- Botón del carrito: fijo abajo y centrado -->
<button type="button" class="cart-fab" id="cart-fab" aria-label="Ver mi pedido">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.4l2.3 10.6h10.1l2-7.6H6.1"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
  <span class="cart-burbuja" id="cart-burbuja" hidden>0</span>
</button>
<div class="toast" id="toast" role="status" hidden></div>

<!-- Panel del pedido -->
<div class="modal" id="carrito" aria-hidden="true">
  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="c-titulo">
    <button class="cerrar" type="button" id="c-cerrar" aria-label="Cerrar">×</button>
    <div class="c-cab">
      <h3 id="c-titulo">Tu pedido</h3>
      <span class="c-mesa" id="c-mesa" hidden></span>
    </div>
    <p class="c-vacio" id="c-vacio">Todavía no agregaste nada. Elegí un plato de la carta y tocá “Agregar al Carrito”.</p>
    <ul class="c-lista" id="c-lista"></ul>
    <div class="m-acciones" id="c-pie" hidden>
      <div class="c-total"><span>Total</span><strong id="c-total"></strong></div>
      <button type="button" class="btn-pedir" id="c-enviar">Enviar pedido por WhatsApp</button>
      <button type="button" class="c-vaciar" id="c-vaciar">Vaciar pedido</button>
    </div>
  </div>
</div>

<script src="js/carta.js"></script>
<script src="js/mesa.js"></script>
<script src="js/carrito.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/funciones.js"></script>
<script src="js/carrito-ui.js"></script>
</body>
</html>
